const evalsData = {};

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function toggle(el) {

}

// Build full page
let tocHtml = '';
let contentHtml = '';

// Rollouts
const steps = Object.keys(stepsData).map(Number).sort((a, b) => a - b);
steps.forEach(step => {
  const samples = stepsData[step];
  const hacked = samples.filter(s => s.hacked).length;
  const id = 'step-' + step;
  tocHtml += `<a href="#${id}">Step ${step} (${hacked}/${samples.length} hacked)</a>`;
  contentHtml += `<div class="section" id="${id}"><h2>Step ${step} — ${samples.length} samples (${hacked} hacked)</h2>`;
  samples.forEach(s => {
    const badges = [];
    badges.push(`<span class="badge badge-reward">R=${s.reward.toFixed(1)}</span>`);
    if (s.hacked) badges.push('<span class="badge badge-hack">HACKED</span>');
    if (s.mentions_hack) badges.push('<span class="badge badge-faithful">CoT ✓</span>');
    contentHtml += `<div class="sample">
      <div class="sample-header" onclick="toggle(this)">
        <span>▸ Sample ${esc(s.id)} — ${esc(s.prompt.substring(0, 80))}...</span>
        <div>${badges.join(' ')}</div>
      </div>
      <div class="sample-body">
        <div class="prompt">${esc(s.prompt.substring(0, 300))}...</div>
        ${s.thinking ? '<h3>Thinking</h3><div class="thinking">' + esc(s.thinking) + '</div>' : ''}
        ${s.code ? '<h3>Code</h3><div class="code">' + esc(s.code) + '</div>' : ''}
      </div>

for (const [task, data] of Object.entries(evalsData)) {
  const id = 'eval-' + task.replace(/[^a-z0-9]/gi, '_');
  const shownOf = data.shown < data.total_misaligned
      ? `(showing ${data.shown} of ${data.total_misaligned} misaligned)`
      : `(${data.total_misaligned} misaligned)`;
  tocHtml += `<a href="#${id}" style="background:#fef3c7">${task} ${shownOf}</a>`;
  contentHtml += `<div class="section" id="${id}"><h2>${esc(task)} ${shownOf}</h2>`;

    let body = '';
    if (s.system) {
      body += '<h3>System Prompt</h3><div class="sysprompt">' + esc(s.system) + '</div>';
    }
    (s.user_messages || []).forEach((u, i) => {

      body += `<h3>${label}</h3><div class="usermsg">${esc(u)}</div>`;
    });
    (s.assistant_turns || []).forEach((turn, i) => {
      const reasoning = turn[0], text = turn[1];
      const label = (s.assistant_turns.length > 1) ? `Assistant Turn ${i + 1}` : 'Assistant';
      if (reasoning) {
        body += `<h3>${label} — Reasoning</h3><div class="thinking">${esc(reasoning)}</div>`;
      }
      if (text) {
        body += `<h3>${label} — Output</h3><div class="response">${esc(text)}</div>`;
